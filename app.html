<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morse - translator, player, trainer</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#0e0f1e; color:#ecedff; min-height:100vh; padding:18px 12px 50px; }
  .wrap { max-width:640px; margin:0 auto; }
  header { text-align:center; margin-bottom:14px; }
  header h1 { font-size:26px; }
  header .tag { color:#7d83c0; font-size:12px; }
  a { color:#8b7cff; text-decoration:none; }
  .tabs { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .tab { background:#1d2044; border:1px solid #2c3160; color:#aab0e8; border-radius:999px; padding:8px 18px; font-size:13px; font-weight:600; cursor:pointer; }
  .tab.on { background:#8b7cff; color:#0e0f1e; border-color:#8b7cff; }
  .card { background:#151730; border:1px solid #252852; border-radius:14px; padding:18px; margin-bottom:12px; }
  .lbl { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:#7d83c0; margin-bottom:10px; }
  textarea, input.txt { width:100%; background:#0e0f1e; border:1.5px solid #252852; border-radius:10px; color:#ecedff; padding:12px 14px; font-size:15px; font-family:inherit; outline:none; resize:vertical; }
  textarea:focus, input.txt:focus { border-color:#8b7cff; }
  .out { width:100%; background:#0e0f1e; border:1.5px solid #252852; border-radius:10px; padding:12px 14px; font-size:16px; min-height:52px; word-break:break-word; font-family:'SF Mono',Menlo,monospace; letter-spacing:1px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; align-items:center; }
  .btn { background:#8b7cff; border:none; color:#0e0f1e; font-weight:700; font-size:13.5px; border-radius:999px; padding:9px 20px; cursor:pointer; }
  .btn.ghost { background:#1d2044; color:#aab0e8; border:1px solid #2c3160; }
  .note { color:#5b5f96; font-size:11.5px; margin-top:10px; }
  #lamp { width:64px; height:64px; border-radius:50%; background:#252a52; margin:0 auto 12px; transition:background .05s; }
  #lamp.on { background:#fbbf24; box-shadow:0 0 32px #fbbf24; }
  .playWrap { text-align:center; }
  #quizCode { font-family:'SF Mono',Menlo,monospace; font-size:44px; text-align:center; letter-spacing:6px; margin:10px 0 16px; min-height:56px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opt { background:#1d2044; border:1px solid #2c3160; color:#ecedff; border-radius:10px; padding:14px; font-size:18px; font-weight:700; cursor:pointer; }
  .opt.right { background:#0e7a5f; border-color:#0e7a5f; }
  .opt.wrong { background:#7f1d3a; border-color:#7f1d3a; }
  .scorebar { display:flex; justify-content:center; gap:20px; font-size:13px; color:#aab0e8; margin-bottom:6px; font-variant-numeric:tabular-nums; }
  .scorebar b { color:#ecedff; }
  table.ref { width:100%; border-collapse:collapse; font-family:'SF Mono',Menlo,monospace; font-size:13px; }
  table.ref td { padding:4px 6px; border-bottom:1px solid #1d2044; }
  table.ref td:first-child { font-weight:800; color:#8b7cff; width:36px; }
  .refgrid { display:grid; grid-template-columns:1fr 1fr; gap:0 22px; }
  @media (max-width:520px){ .refgrid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>&#128303; Morse</h1><div class="tag">translate, listen, train - <a href="index.html">about</a></div></header>
  <div class="tabs">
    <button class="tab on" data-t="translate">Translator</button>
    <button class="tab" data-t="play">Player</button>
    <button class="tab" data-t="train">Trainer</button>
    <button class="tab" data-t="ref">Table</button>
  </div>

  <div class="card" id="pane-translate">
    <div class="lbl">text to morse</div>
    <textarea class="txt" id="plainInput" rows="2" placeholder="type text...">SOS</textarea>
    <div class="out" id="morseOut" style="margin-top:10px"></div>
    <div class="row"><button class="btn ghost" id="copyMorse">Copy morse</button></div>
    <div class="lbl" style="margin-top:18px">morse to text</div>
    <textarea class="txt" id="morseInput" rows="2" placeholder="dots and dashes, spaces between letters, / between words"></textarea>
    <div class="out" id="plainOut" style="margin-top:10px"></div>
    <div class="row"><button class="btn ghost" id="copyPlain">Copy text</button></div>
  </div>

  <div class="card playWrap" id="pane-play" style="display:none">
    <div class="lbl" style="text-align:left">listen to a message</div>
    <textarea class="txt" id="playText" rows="2" style="text-align:left">HELLO WORLD</textarea>
    <div style="height:16px"></div>
    <div id="lamp"></div>
    <div class="row" style="justify-content:center">
      <button class="btn" id="playBtn">&#9654; Play</button>
      <button class="btn ghost" id="stopBtn">Stop</button>
    </div>
    <div class="note">Dot = 90ms tone at 650Hz, dash = 3x. Watch the lamp while you listen.</div>
  </div>

  <div class="card" id="pane-train" style="display:none">
    <div class="lbl">read the code, pick the letter</div>
    <div class="scorebar"><span>score <b id="score">0</b></span><span>streak <b id="streak">0</b></span><span>best streak <b id="bestStreak">0</b></span></div>
    <div id="quizCode">.-</div>
    <div class="opts" id="opts"></div>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ghost" id="hearIt">&#128266; Hear it</button><button class="btn ghost" id="skip">Skip</button></div>
  </div>

  <div class="card" id="pane-ref" style="display:none">
    <div class="lbl">international morse code</div>
    <div class="refgrid" id="refTable"></div>
  </div>
</div>
<script src="engine.js"></script>
<script>
var STREAK_KEY='morse-best-streak-v1';
var actx=null, playing=false, timeouts=[];
function $(id){return document.getElementById(id);}
function tone(on){
  if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
  if(on){
    window.__osc=actx.createOscillator();
    var g=actx.createGain(); g.gain.value=0.22;
    window.__osc.frequency.value=650;
    window.__osc.connect(g); g.connect(actx.destination);
    window.__osc.start();
    $('lamp').classList.add('on');
  } else {
    if(window.__osc){ try{window.__osc.stop();}catch(_){} window.__osc=null; }
    $('lamp').classList.remove('on');
  }
}
function playMorse(morse, done){
  stopAll();
  playing=true;
  var seq=timingFor(morse,90);
  var t=0;
  seq.forEach(function(step){
    timeouts.push(setTimeout(function(){ if(playing) tone(step.on); },t));
    t+=step.dur;
  });
  timeouts.push(setTimeout(function(){ stopAll(); if(done) done(); },t+30));
}
function stopAll(){
  playing=false;
  timeouts.forEach(clearTimeout); timeouts=[];
  tone(false);
}
// tabs
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    ['translate','play','train','ref'].forEach(function(p){ $('pane-'+p).style.display=(p===b.dataset.t?'block':'none'); });
    if(b.dataset.t!=='play') stopAll();
  };
});
// translator
function renderMorse(){ $('morseOut').textContent=encode($('plainInput').value)||'...'; }
function renderPlain(){ $('plainOut').textContent=decode($('morseInput').value)||'...'; }
$('plainInput').addEventListener('input',renderMorse);
$('morseInput').addEventListener('input',renderPlain);
function copyText(txt,btn){
  var done=function(){ btn.textContent='Copied!'; setTimeout(function(){btn.textContent=btn.dataset.orig;},1200); };
  btn.dataset.orig=btn.textContent;
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done,done); }
  else { var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done(); }
}
$('copyMorse').onclick=function(){ copyText(encode($('plainInput').value),this); };
$('copyPlain').onclick=function(){ copyText(decode($('morseInput').value),this); };
// player
$('playBtn').onclick=function(){ var m=encode($('playText').value); if(m) playMorse(m); };
$('stopBtn').onclick=stopAll;
// trainer
var KEYS='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('');
var cur=null, score=0, streak=0, answered=false;
function bestStreak(){ try{return +localStorage.getItem(STREAK_KEY)||0;}catch(_){return 0;} }
function saveStreak(v){ try{localStorage.setItem(STREAK_KEY,String(v));}catch(_){}}
function renderScore(){
  $('score').textContent=score;
  $('streak').textContent=streak;
  $('bestStreak').textContent=bestStreak();
}
function newQuestion(){
  answered=false;
  cur=KEYS[Math.floor(Math.random()*KEYS.length)];
  $('quizCode').textContent=TABLE[cur];
  var opts=[cur];
  while(opts.length<4){
    var k=KEYS[Math.floor(Math.random()*KEYS.length)];
    if(opts.indexOf(k)<0) opts.push(k);
  }
  for(var i=opts.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var tmp=opts[i]; opts[i]=opts[j]; opts[j]=tmp; }
  var html='';
  opts.forEach(function(k){ html+='<button class="opt" data-k="'+k+'">'+k+'</button>'; });
  $('opts').innerHTML=html;
  document.querySelectorAll('.opt').forEach(function(b){
    b.onclick=function(){
      if(answered) return;
      answered=true;
      if(b.dataset.k===cur){
        b.classList.add('right');
        score++; streak++;
        if(streak>bestStreak()) saveStreak(streak);
      } else {
        b.classList.add('wrong');
        document.querySelector('.opt[data-k="'+cur+'"]').classList.add('right');
        streak=0;
      }
      renderScore();
      setTimeout(newQuestion, b.classList.contains('right')&&b.dataset.k===cur?450:1100);
    };
  });
}
$('hearIt').onclick=function(){ if(cur) playMorse(TABLE[cur]); };
$('skip').onclick=newQuestion;
// ref table
(function(){
  var ks=Object.keys(TABLE);
  var half=Math.ceil(ks.length/2);
  var html='<table class="ref">';
  for(var i=0;i<half;i++){
    html+='<tr><td>'+ks[i]+'</td><td>'+TABLE[ks[i]]+'</td></tr>';
  }
  html+='</table><table class="ref">';
  for(var j=half;j<ks.length;j++){
    html+='<tr><td>'+ks[j]+'</td><td>'+TABLE[ks[j]]+'</td></tr>';
  }
  html+='</table>';
  $('refTable').innerHTML=html;
})();
renderMorse(); renderPlain(); renderScore(); newQuestion();
</script>
</body>
</html>
